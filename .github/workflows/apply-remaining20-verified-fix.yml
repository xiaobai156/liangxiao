name: Apply remaining 20 verified fix

on:
  push:
    branches: ['apply/remaining20-verified-fix']
    paths:
      - '.github/workflows/apply-remaining20-verified-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Decode exact live-verified candidate
        shell: pwsh
        run: |
          git fetch origin test/remaining20-final-candidate
          $encoded = git show "origin/test/remaining20-final-candidate:tools/remaining20-final-candidate.patch.xz.b64"
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\candidate.patch.xz", [Convert]::FromBase64String((($encoded -join '')).Trim()))
          $hash = (Get-FileHash "$env:RUNNER_TEMP\candidate.patch.xz" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '9828bd0740fb3534fe3f8d02e37f83b30d4ed0a4206a7858706a88d2e02687ec') { throw "patch checksum mismatch: $hash" }
          xz -dc "$env:RUNNER_TEMP\candidate.patch.xz" | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\candidate.patch"
      - name: Require unchanged main and apply exact patch
        shell: pwsh
        run: |
          git fetch origin main
          $main = (git rev-parse origin/main).Trim()
          if ($main -ne '88173887b1da07171f765bfe114b9c481eeda34f') { throw "main changed; refusing automatic push: $main" }
          git apply --check --whitespace=error-all "$env:RUNNER_TEMP\candidate.patch"
          git apply --whitespace=error-all "$env:RUNNER_TEMP\candidate.patch"
      - name: Sync only cache config fingerprint
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          @'
          import re
          from pathlib import Path
          from cache.contracts import config_fingerprint
          from config.loader import load_sites
          from parsers.registry import ENGINE_REGISTRY

          path = Path('recent_10_cache.json')
          text = path.read_text(encoding='utf-8-sig')
          fingerprint = config_fingerprint(
              load_sites(Path('config/sites.json'), allowed_parsers=ENGINE_REGISTRY)
          )
          if fingerprint != '57672144d9a271fce397126c690a9971cce5ca9cccd511dba76f61fe2031851b':
              raise SystemExit(f'unexpected config fingerprint: {fingerprint}')
          updated, count = re.subn(
              r'("config_fingerprint"\s*:\s*")[0-9a-f]{64}(")',
              lambda match: match.group(1) + fingerprint + match.group(2),
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected exactly one config_fingerprint, found {count}')
          path.write_text(updated, encoding='utf-8')
          '@ | Set-Content -Encoding UTF8 sync_fp.py
          python sync_fp.py
          Remove-Item sync_fp.py
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate exact final tree
        shell: pwsh
        run: |
          python tools/run_offline_tests.py -q tests
          python -m compileall -q cli.py domain config fetching parsers validation services cache output diagnostics
          git diff --check
          python -c "from pathlib import Path; from config.loader import load_sites; from parsers.registry import ENGINE_REGISTRY; from cache.contracts import config_fingerprint, validate_cache_position_contract; import json; sites=load_sites(Path('config/sites.json'), allowed_parsers=ENGINE_REGISTRY); cache=json.loads(Path('recent_10_cache.json').read_text(encoding='utf-8-sig')); validate_cache_position_contract(cache); assert cache['config_fingerprint']==config_fingerprint(sites)"
          $allowed = @(
            'config/sites.json',
            'parsers/chart.py',
            'parsers/helpers.py',
            'parsers/registry.py',
            'recent_10_cache.json',
            'tests/test_audit_repairs_boundaries.py'
          )
          $changed = @(git diff --name-only HEAD | Where-Object { $_ })
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          $missing = @($allowed | Where-Object { $_ -notin $changed })
          if ($unexpected.Count -gt 0) { throw "unexpected changed paths: $($unexpected -join ', ')" }
          if ($missing.Count -gt 0) { throw "missing expected changed paths: $($missing -join ', ')" }
      - name: Materialize verified tree and push main without force
        shell: pwsh
        run: |
          $main = '88173887b1da07171f765bfe114b9c481eeda34f'
          git config user.name "xiaobai156"
          git config user.email "20069100+xiaobai156@users.noreply.github.com"
          git add -- config/sites.json parsers/chart.py parsers/helpers.py parsers/registry.py recent_10_cache.json tests/test_audit_repairs_boundaries.py
          git diff --cached --check
          git rm -f -- .github/workflows/apply-remaining20-verified-fix.yml
          $tree = (git write-tree).Trim()
          $commit = (git commit-tree $tree -p $main -m "fix: restore remaining verified period extraction").Trim()
          git fetch origin main
          $latest = (git rev-parse origin/main).Trim()
          if ($latest -ne $main) { throw "main changed before push; refusing automatic push: $latest" }
          git push origin "${commit}:refs/heads/main"

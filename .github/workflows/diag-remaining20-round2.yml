name: Diagnose remaining 20 round 2

on:
  push:
    branches: ['test/remaining20-round2']
    paths:
      - '.github/workflows/diag-remaining20-round2.yml'
      - 'tools/fix20-code-r2.patch.xz.b64'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply candidate code patch
        shell: pwsh
        run: |
          $encoded = Get-Content -Raw tools/fix20-code-r2.patch.xz.b64
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\fix.patch.xz", [Convert]::FromBase64String($encoded.Trim()))
          $hash = (Get-FileHash "$env:RUNNER_TEMP\fix.patch.xz" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '33cfcfbf1be32c41ce80fd783e773fb4cbb65d61c7a627c0b6898ae06fc61b93') { throw "patch checksum mismatch: $hash" }
          xz -dc "$env:RUNNER_TEMP\fix.patch.xz" | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\fix.patch"
          git apply --check --whitespace=error-all "$env:RUNNER_TEMP\fix.patch"
          git apply --whitespace=error-all "$env:RUNNER_TEMP\fix.patch"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Inspect target document tails
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          @'
          import re
          from pathlib import Path
          from config.loader import load_sites
          from fetching.client import FetchContext
          from parsers.helpers import visible_source_text
          from parsers.registry import ENGINE_REGISTRY, ParserRegistry
          from services.single_period import fetch_payload_for_period

          names = ['呻吟成瘾','人心如镜','乐不可支','梦寐以求第二','科方东文','曹国舅']
          sites = [s for s in load_sites(Path('config/sites.json'), allowed_parsers=ENGINE_REGISTRY) if s.name in names]
          registry = ParserRegistry.bind_sites(sites)
          for site in sites:
              print('\n===SITE', site.name, '===')
              context = FetchContext()
              try:
                  bundle = fetch_payload_for_period(site, 252, 25, context, registry)
                  for index, doc in enumerate(bundle.documents):
                      text = visible_source_text(doc.source)
                      title_matches = list(re.finditer(site.title, text, flags=re.I)) if site.title else []
                      name_matches = list(re.finditer(re.escape(site.name.replace('第二','')), text, flags=re.I))
                      if not title_matches and not name_matches:
                          continue
                      print('DOC', index, doc.label, doc.url, 'LEN', len(text), 'TITLE', len(title_matches), 'NAME', len(name_matches))
                      print('TAIL', repr(text[-2600:]))
              except Exception as exc:
                  print('ERR', type(exc).__name__, str(exc))
              finally:
                  context.close()
          '@ | Set-Content -Encoding UTF8 diag_tails.py
          python diag_tails.py

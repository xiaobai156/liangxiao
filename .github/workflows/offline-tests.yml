name: Offline tests

on:
  push:
    branches: [main, 'repair/**']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export audit source snapshot
        if: startsWith(github.ref_name, 'repair/')
        run: git archive --format=zip --output="${{ runner.temp }}/source.zip" HEAD
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref_name, 'repair/')
        with:
          name: audit-source
          path: ${{ runner.temp }}/source.zip
          retention-days: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install requests pytest
      - name: Compile source
        run: python -m compileall -q cli.py domain config fetching parsers validation services cache output diagnostics
      - name: Test without live network
        run: python tools/run_offline_tests.py -q tests --junitxml="${{ runner.temp }}/pytest.xml"
      - name: Check whitespace
        run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ runner.temp }}/pytest.xml
          retention-days: 7
